<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=0, user-scalable=no">
    <meta name="keywords"
        content="iOS developer portfolio, macOS developer, agentic AI developer, App Store apps, Claude Code tools, MCP server, Swift, SwiftUI, AppKit">
    <meta name="description"
        content="A project by Roman Resenchuk, iOS/macOS and agentic AI developer.">
    <meta name="author" content="Roman Resenchuk">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.resrom.com/project.html?name=">
    <meta property="og:title" content="Project | Roman Resenchuk">
    <meta property="og:description"
        content="A project by Roman Resenchuk, iOS/macOS and agentic AI developer.">
    <meta property="og:image" content="https://www.resrom.com/img/avatar3.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.resrom.com/project.html?name=">
    <meta name="twitter:title" content="Project | Roman Resenchuk">
    <meta name="twitter:description"
        content="A project by Roman Resenchuk, iOS/macOS and agentic AI developer.">
    <meta name="twitter:image" content="https://www.resrom.com/img/avatar3.jpg">

    <link rel="canonical" href="https://www.resrom.com/project.html?name=">
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable profile summary">
    <link rel="stylesheet" href="css/style.css?v=20260930">
    <title>Project | Roman Resenchuk</title>
    <script type="module" src="firebase-analytics.js"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="/">
                    <h1>Roman Resenchuk<small> iOS/macOS &amp; Agentic AI Developer</small></h1>
                </a>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="/projects.html">All projects</a></li>
                    <li><a href="/#about">About me</a></li>
                    <li><a href="/#contact">Contact me</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="project" id="project-details">
                <!-- Project details will be loaded here -->
            </section>
            <hr>
        </div>
    </main>

    <footer>Roman Resenchuk<br>© <span id="current-year"></span></footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Get project name from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectName = urlParams.get('name');

        if (!projectName) {
            window.location.href = 'projects.html';
        }

        // Load and display project details
        async function loadProjectDetails() {
            try {
                const response = await fetch('data.json', { cache: 'no-cache' });
                const data = await response.json();

                // Find project in all years
                let project = null;
                for (const year in data) {
                    if (data[year][projectName]) {
                        project = data[year][projectName];
                        break;
                    }
                }

                if (!project) {
                    window.location.href = 'projects.html';
                    return;
                }

                // Update meta tags dynamically
                document.title = `${project.title} | Roman Resenchuk`;
                document.querySelector('meta[name="description"]').setAttribute('content', project.desc);
                document.querySelector('meta[property="og:url"]').setAttribute('content', `https://www.resrom.com/project.html?name=${projectName}`);
                document.querySelector('meta[property="og:title"]').setAttribute('content', `${project.title} | Roman Resenchuk`);
                document.querySelector('meta[property="og:description"]').setAttribute('content', project.desc);
                document.querySelector('meta[property="og:image"]').setAttribute('content', `https://www.resrom.com/img/works/${project.img}.jpg`);
                document.querySelector('meta[name="twitter:url"]').setAttribute('content', `https://www.resrom.com/project.html?name=${projectName}`);
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${project.title} | Roman Resenchuk`);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', project.desc);
                document.querySelector('meta[name="twitter:image"]').setAttribute('content', `https://www.resrom.com/img/works/${project.img}.jpg`);
                document.querySelector('link[rel="canonical"]').setAttribute('href', `https://www.resrom.com/project.html?name=${projectName}`);

                const container = document.getElementById('project-details');

                // Create project image
                const img = document.createElement('img');
                img.className = 'img-fluid';
                img.src = `img/works/${project.cover || `${project.img}.jpg`}?v=20261006`;
                img.alt = project.title;
                container.appendChild(img);

                // Create project title
                const title = document.createElement('h2');
                title.textContent = project.title;
                container.appendChild(title);

                // Create project description
                const desc = document.createElement('p');
                desc.innerHTML = project.desc.replace(/\n/g, '<br>');
                container.appendChild(desc);

                // Create App Store or GitHub link if available
                if (project.link) {
                    const link = document.createElement('a');
                    link.href = project.link;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    const linkImg = document.createElement('img');
                    const isGitHub = project.link.includes('github.com');
                    linkImg.src = isGitHub ? 'img/github.svg' : 'img/applestore.png';
                    linkImg.alt = isGitHub ? 'View source on GitHub' : 'Available on the App Store';
                    link.appendChild(linkImg);
                    container.appendChild(link);
                }
            } catch (error) {
                console.error('Error loading project details:', error);
                window.location.href = 'projects.html';
            }
        }

        loadProjectDetails();
    </script>
</body>

</html>
