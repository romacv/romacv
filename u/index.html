<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://storage.googleapis.com/resromcom-493b4-autopost/ https://us-central1-resromcom-493b4.cloudfunctions.net/webhook; base-uri 'none'; form-action 'none'">
<title>Загрузка файлов</title>
<style>body{font:18px system-ui;max-width:640px;margin:48px auto;padding:0 24px;color:#202124}button,input{font:inherit;margin:12px 0;max-width:100%}progress{width:100%}li{margin-bottom:16px}button{padding:12px 20px}p{line-height:1.5}</style>
</head>
<body>
<h1>Загрузка файлов</h1>
<p>Выбери файлы в порядке, указанном в списке. Ссылка действует 15 минут.</p>
<ol id="files"></ol>
<input id="picker" type="file" accept="video/mp4,image/jpeg,image/png,image/webp,image/heic,.heic,.heif" multiple>
<button id="start" disabled>Загрузить</button>
<progress id="progress" value="0" max="100"></progress>
<p id="status" role="status">Открой ссылку из чата.</p>
<script>
'use strict';
const picker=document.getElementById('picker'), start=document.getElementById('start'), status=document.getElementById('status'), progress=document.getElementById('progress');
const images=['.jpg','.jpeg','.png','.webp','.heic','.heif'], extensions={'video/mp4':['.mp4'],'image/jpeg':images,'image/png':images,'image/webp':images,'image/heic':images};
let ticket;
try {
  ticket=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  history.replaceState(null,'',location.pathname);
  if(!Array.isArray(ticket.uploads)||!ticket.uploads.length||ticket.uploads.length>20||ticket.receipt.expires*1000<Date.now()) throw Error();
  const complete=new URL(ticket.complete);
  if(complete.href!=='https://us-central1-resromcom-493b4.cloudfunctions.net/webhook') throw Error();
  for(const upload of ticket.uploads){
    const url=new URL(upload.url);
    upload.type=upload.type||'video/mp4';
    if(!extensions[upload.type])throw Error();
    if(url.origin!=='https://storage.googleapis.com'||!url.pathname.startsWith('/resromcom-493b4-autopost/inbox/')||url.username||url.password) throw Error();
    const li=document.createElement('li'); li.textContent=upload.name; document.getElementById('files').append(li);
  }
  status.textContent='Выбери '+ticket.uploads.length+' файл(а).';
} catch {ticket=null; status.textContent='Ссылка отсутствует, повреждена или истекла. Запроси новую в чате.';}
picker.addEventListener('change',()=>{start.disabled=!ticket||picker.files.length!==ticket.uploads.length;});
function put(url,type,file,onProgress){
  return new Promise((resolve,reject)=>{
    const request=new XMLHttpRequest(); request.open('PUT',url); request.setRequestHeader('Content-Type',type);request.setRequestHeader('x-goog-if-generation-match','0');
    request.upload.onprogress=event=>{if(event.lengthComputable)onProgress(event.loaded/event.total);};
    request.onload=()=>request.status>=200&&request.status<300?resolve():reject(Error());
    request.onerror=()=>reject(Error()); request.send(file);
  });
}
start.addEventListener('click',async()=>{
  const selected=Array.from(picker.files);
  if(selected.some((file,index)=>!extensions[ticket.uploads[index].type].some(extension=>file.name.toLowerCase().endsWith(extension)))){
    const videos=ticket.uploads.filter(upload=>upload.type==='video/mp4').length, photos=ticket.uploads.length-videos;
    status.textContent='Нужно: '+[videos&&videos+' видео MP4',photos&&photos+' фото'].filter(Boolean).join(' и ')+', по порядку как в чате';
    return;
  }
  start.disabled=true;picker.disabled=true;
  try {
    if(ticket.receipt.expires*1000<Date.now())throw Error();
    const total=selected.reduce((sum,file)=>sum+file.size,0);let uploaded=0;
    if(total>1024*1024*1024)throw Error();
    if(selected.some(file=>file.size>512*1024*1024))throw Error();
    for(let index=0;index<selected.length;index++){
      status.textContent='Загрузка '+(index+1)+' из '+selected.length;
      await put(ticket.uploads[index].url,ticket.uploads[index].type,selected[index],fraction=>{progress.value=100*(uploaded+selected[index].size*fraction)/total;});
      uploaded+=selected[index].size;
    }
    const response=await fetch(ticket.complete,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ticket.receipt),credentials:'omit',referrerPolicy:'no-referrer'});
    if(!response.ok)throw Error();
    progress.value=100;status.textContent='Файлы загружены. Можно вернуться в чат.';
  } catch {status.textContent='Загрузка не завершена. Вернись в чат за новой ссылкой. Не закрывай страницу до завершения загрузки.';}
});
</script>
</body>
</html>
