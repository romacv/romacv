<body>

<script>

const TARGET_TEXT={planned:'ждёт',done:'опубликовано',verified:'проверено',unverifiable:'без проверки',unverified:'не подтверждено',checking:'проверяю'};

function model(d){

      f.append(ex.length?group('Примеры',ex.map(x=>{
        const r=el('div','ex'),good=x.verdict==='good';
        r.append(el('div','k '+(good?'ok':'bad'),good?'Хороший пример':'Плохой пример'));
        if(x.feedback)r.append(el('p','',x.feedback));
        [['Было',x.before],['Стало',x.after]].forEach(([n,v])=>{if(v){r.append(el('div','k',n),el('p','',v))}});
        return r;
      })):group('Примеры',[empty('Примеров пока нет: они появляются из твоих оценок в чате.')]));
    }
  }else if(!list.length)f.append(sentence('Пока нет навыков.'));
  else f.append(group(null,list.map(k=>{
    const n=k.examples.length,r=el('div','rowb');
    r.append(el('div','n',k.title),el('span'),chevron(),el('div','s',n?n+' '+plural(n,['пример','примера','примеров']):'без примеров'));
    press(r,()=>pushSkill(k.id));
    return r;
  })));
  setAction(null);
  syncBack();
  box.replaceChildren(f);
}
function render(){
  const d=data();
  if(!d){box.replaceChildren(failed?errorGroup():skeleton());return}
  const y=window.scrollY,sc={};
  document.querySelectorAll('.chat[data-k]').forEach(c=>{sc[c.dataset.k]=c.scrollTop});
  (view==='costs'?renderCosts:view==='skills'?renderSkills:view==='goals'?renderGoals:renderProgress)(d);
  document.querySelectorAll('.chat[data-k]').forEach(c=>{if(sc[c.dataset.k])c.scrollTop=sc[c.dataset.k]});
  tick();
  window.scrollTo(0,y);
}
function errorGroup(){
  const code=failed,text=code==='401'?'Открой заново из бота.':code==='403'?'Нет доступа.':code==='503'?'Сервер недоступен.':'Нет связи.';
  setAction(code==='401'?{text:'Открыть заново',fn:()=>app.close()}:code==='403'?null:{text:'Повторить',fn:()=>load()});
  return sentence(text);
}
function setAction(a){
  action=a;
  const b=app&&app.MainButton;
  if(!b)return;
  if(a){b.setText(a.text);b.show()}else b.hide();
}
function mark(){Object.keys(views).forEach(k=>{const t=document.getElementById('tab-'+k);t.setAttribute('aria-selected',String(k===view));t.tabIndex=k===view?0:-1})}
function footer(){
  hd.textContent='Автопостер'+(loaded?' · обновлено '+hm(loaded):'');
  state.textContent=!app||!app.initData?'Открой страницу из бота.':broken?'Не удалось показать данные':failed&&loaded?'Нет связи · данные от '+hm(loaded):'';
}
function syncBack(){
  const b=app&&app.BackButton;
  if(!b)return;
  view==='skills'&&skill?b.show():b.hide();
}
function working(){const d=cache.progress;return !!d&&model(d).some(r=>r.kind==='working')}
function isActive(){return document.visibilityState!=='hidden'&&(!app||app.isActive!==false)}
function schedule(){
  clearTimeout(timer);
  timer=setTimeout(()=>{if(isActive())load();else schedule()},working()?10000:60000);
}
let broken=false;
function draw(){try{render();broken=false}catch(e){broken=true;console.error('render failed',e)}}
async function load(){
  if(busy||!app||!app.initData)return;
  busy=true;
  const asked=view,askedSkill=skill,key=dataKey();
  let body=null;
  try{
    const response=await fetch(endpoint+(view==='progress'?'':'?view='+view+(view==='skills'&&skill?'&skill='+encodeURIComponent(skill):'')),{headers:{Authorization:'tma '+app.initData},cache:'no-store'});
    if(!response.ok)throw Error(response.status);
    body=await response.json();
  }catch(e){
    if(asked===view&&askedSkill===skill){
      failed=e.message;
      if(cache[key])footer();
      else{haptic('notificationOccurred','error');draw();footer()}
    }
  }
  if(body){
    cache[key]=body;offset=body.now-Date.now()/1000;loaded=now();failed=null;
    if(asked===view&&askedSkill===skill){draw();footer()}
  }
  busy=false;if(asked!==view||askedSkill!==skill)load();schedule();syncTicker();
}
function fadeIn(){box.classList.remove('in');void box.offsetWidth;box.classList.add('in')}
function show(){failed=null;mark();syncBack();fadeIn();draw();footer();load()}
function switchView(next){
  if(next===view&&!skill)return;
  haptic();
  view=next;skill=null;
  const url=new URL(location.href);url.searchParams.set('view',view);url.searchParams.delete('skill');history.replaceState(null,'',url);
  show();
}
function pushSkill(id){
  light();skill=id;
  const url=new URL(location.href);url.searchParams.set('view','skills');url.searchParams.set('skill',id);history.pushState({skill:id},'',url);
  show();
}
addEventListener('popstate',()=>{
  const q=new URLSearchParams(location.search);
  view=q.get('view') in views?q.get('view'):'progress';skill=view==='skills'?q.get('skill')||null:null;
  show();
});
function theme(){if(app)document.documentElement.dataset.scheme=app.colorScheme}
if(app){
  app.ready();app.expand();theme();
  const ok=v=>app.isVersionAtLeast&&app.isVersionAtLeast(v);
  try{app.setHeaderColor('secondary_bg_color');app.setBackgroundColor('secondary_bg_color')}catch(e){}
  try{if(ok('7.10'))app.setBottomBarColor('secondary_bg_color')}catch(e){}
  try{if(ok('7.7'))app.disableVerticalSwipes()}catch(e){}
  app.onEvent('themeChanged',()=>{theme();try{app.setHeaderColor('secondary_bg_color');app.setBackgroundColor('secondary_bg_color')}catch(e){}});
  app.onEvent('activated',()=>load());
  app.MainButton.onClick(()=>{if(action)action.fn()});
  if(app.BackButton)app.BackButton.onClick(()=>{if(history.state&&history.state.skill)history.back();else{skill=null;const url=new URL(location.href);url.searchParams.delete('skill');history.replaceState(null,'',url);show()}});
}
Object.keys(views).forEach(k=>document.getElementById('tab-'+k).addEventListener('click',()=>switchView(k)));
state.addEventListener('click',()=>{light();load()});
let ticker=null;
function syncTicker(){const on=working();if(on&&!ticker)ticker=setInterval(tick,1000);else if(!on&&ticker){clearInterval(ticker);ticker=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
mark();syncBack();draw();footer();load();
</script>
</body>
</html>
