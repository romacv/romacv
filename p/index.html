<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src https://us-central1-resromcom-493b4.cloudfunctions.net/progress; base-uri 'none'; form-action 'none'">
<title>Прогресс</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:16px 16px 32px;font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}
#refresh{font:inherit;font-size:15px;border:0;background:none;padding:4px 0;color:var(--tg-theme-link-color,#2481cc)}
#refresh:active{opacity:.5}
.switch{display:flex;gap:8px;margin-top:12px}
.switch button{flex:1;min-height:44px;border:0;border-radius:12px;font:inherit;font-weight:600;background:var(--tg-theme-secondary-bg-color,#f1f1f4);color:var(--tg-theme-text-color,#000);-webkit-tap-highlight-color:transparent}
.switch button[aria-pressed=true]{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
.switch button:active{opacity:.7}
h2{margin:24px 0 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tg-theme-section-header-text-color,var(--tg-theme-hint-color,#6d6d72))}
section{background:var(--tg-theme-secondary-bg-color,#f1f1f4);border-radius:12px;overflow:hidden}
.row{padding:12px 16px;border-top:1px solid var(--tg-theme-section-separator-color,rgba(128,128,128,.25));cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.row:first-child{border-top:0}
.row:active{background:rgba(128,128,128,.16)}
.plain{cursor:default}
.plain:active{background:none}
.line{display:flex;justify-content:space-between;gap:12px}
.title{font-weight:600;overflow-wrap:anywhere}
.time{font-variant-numeric:tabular-nums;color:var(--tg-theme-hint-color,#6d6d72);text-align:right}
.hint{color:var(--tg-theme-hint-color,#6d6d72);font-size:14px}
.stage{margin-top:2px;color:var(--tg-theme-accent-text-color,var(--tg-theme-link-color,#2481cc))}
.more{margin-top:8px;font-size:14px}
.more>div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.more .done{color:var(--tg-theme-hint-color,#6d6d72)}
.more .current{font-weight:600}
.more a{color:var(--tg-theme-link-color,#2481cc);text-decoration:none;overflow-wrap:anywhere}
.big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.help{flex:none;width:44px;height:44px;margin:-8px -10px -8px 0;border:0;border-radius:50%;background:none;font:600 18px/1 system-ui,-apple-system,sans-serif;color:var(--tg-theme-link-color,#2481cc);-webkit-tap-highlight-color:transparent}
.help>span{display:inline-block;width:28px;line-height:28px;border-radius:50%;background:var(--tg-theme-bg-color,#fff)}
.help:active{opacity:.5}
.bar{height:4px;margin-top:8px;border-radius:2px;overflow:hidden;background:var(--tg-theme-bg-color,#fff)}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--tg-theme-button-color,#2481cc)}
.bar.warn>i{background:#e8a317}
.bar.over>i{background:var(--tg-theme-destructive-text-color,#d93025)}
.free{color:var(--tg-theme-hint-color,#6d6d72)}
#state{margin-top:24px;text-align:center}
.note{margin:8px 4px 0}
</style>
</head>
<body>
<header><h1 id="heading">Прогресс</h1><button id="refresh" type="button">Обновить</button></header>
<div class="switch" role="group" aria-label="Раздел"><button type="button" id="tab-progress" aria-pressed="false">Прогресс</button><button type="button" id="tab-costs" aria-pressed="false">Расходы</button></div>
<div id="active"></div>
<div id="waiting"></div>
<div id="published"></div>
<div id="limits"></div>
<p id="state" class="hint" role="status">Загрузка…</p>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
const app=window.Telegram&&Telegram.WebApp, endpoint='https://us-central1-resromcom-493b4.cloudfunctions.net/progress', state=document.getElementById('state'), views={progress:'Прогресс',costs:'Расходы'};
let view=new URLSearchParams(location.search).get('view')==='costs'?'costs':'progress';
function mark(){
  document.title=document.getElementById('heading').textContent=views[view];
  Object.keys(views).forEach(k=>document.getElementById('tab-'+k).setAttribute('aria-pressed',String(k===view)));
}
mark();
let data=null, offset=0, busy=false, open=null, balanceOpen=false;
if(app){app.ready();app.expand()}
const number=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const clock=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const stamp=t=>{const d=new Date(t*1000),today=new Date().toDateString()===d.toDateString();return (today?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', ')+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
const hour=t=>new Date(t*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const money=(v,c)=>{const p=c==='USD'||!c?'$':c+' ',n=Number(v);if(n>0&&n<0.01)return '<'+p+'0.01';const [i,f]=n.toFixed(2).split('.');return p+Number(i).toLocaleString('ru-RU')+'.'+f};
const now=()=>Date.now()/1000+offset;
const haptic=()=>{try{app.HapticFeedback.selectionChanged()}catch(e){}};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function line(left,right){const l=el('div','line');l.append(left,right);return l}
function spend(paid,near){return paid===undefined?'':paid===0?(near?'≈бесплатно':'бесплатно'):'≈'+money(paid)}
function link(name,url){
  if(typeof url!=='string'||!url.startsWith('https://'))return el('span','',name);
  const a=el('a','',name);a.href=url;
  a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();haptic();if(!app)return;/^https:\/\/t\.me\//.test(url)&&app.openTelegramLink?app.openTelegramLink(url):app.openLink(url)});
  return a;
}
function row(key,head,details){
  const r=el('div','row');r.append(head);
  if(!details){r.classList.add('plain');return r}
  r.setAttribute('role','button');r.tabIndex=0;
  if(open===key)r.append(details());
  const toggle=()=>{haptic();open=open===key?null:key;render()};
  r.addEventListener('click',toggle);
  r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  return r;
}
function costs(c){
  const box=el('div','more');
  c.anthropic.forEach(k=>box.append(line(el('span','','Anthropic: '+k.kind),el('span','time','≈'+money(k.usd)))));
  if(c.speech_min)box.append(line(el('span','','Речь: '+number(c.speech_min)+' мин'),el('span','time',spend(c.speech_paid))));
  if(c.vcpu_s||c.gib_s)box.append(line(el('span','','Рендер: '+number(c.vcpu_s)+' vCPU·с, '+number(c.gib_s)+' ГиБ·с'),el('span','time',spend(c.render_paid))));
  box.append(line(el('span','title','Итого'),el('span','time','≈'+money(c.total))));
  return box;
}
function group(id,head,rows){const box=document.getElementById(id);box.replaceChildren();if(!rows.length)return;box.append(el('h2','',head));const s=el('section');s.append(...rows);box.append(s)}
function render(){
  if(!data)return;
  if(view==='costs'){limits();return}
  group('active','Сейчас',data.active.map((job,i)=>{
    const head=el('div'), time=el('span','time');
    head.append(line(el('span','title',job.title||'Без названия'),time));
    if(job.label)head.append(el('div','stage',job.label));
    return row('a'+(job.id||i),head,job.steps.length||job.cost?()=>{
      const box=el('div','more');
      job.steps.forEach(step=>{
        const item=el('div',step.done?'done':'current'), t=el('span','time',clock(step.seconds)+' · '+number(step.vcpu_s)+' vCPU·с'+(step.paid===undefined?'':' · '));
        const s=el('span',step.paid===0&&!step.near?'free':'',spend(step.paid,step.near));
        if(step.paid!==undefined)t.append(s);
        item.append(el('span','',step.label),t);
        box.append(item);
      });
      if(job.cost)box.append(costs(job.cost));
      return box;
    }:null);
  }));
  group('waiting','Ждёт ответа',data.waiting.map((w,i)=>{
    const head=el('div','title',w.title||'Без названия');
    return row('w'+(w.id||i),head,()=>{
      const box=el('div','more');
      box.append(el('div','',w.wait));
      if(w.targets.length)box.append(el('div','hint','Куда: '+w.targets.join(', ')));
      if(w.cost)box.append(costs(w.cost));
      return box;
    });
  }));
  group('published','Опубликовано',data.published.map((p,i)=>{
    const head=line(el('span','title',p.title||'Без названия'),el('span','time',hour(p.at)));
    return row('p'+(p.id||i),head,()=>{
      const box=el('div','more');
      if(!p.links.length)box.append(el('div','hint',p.state==='partial'?'Опубликовано не везде.':'Ссылок нет.'));
      p.links.forEach(l=>{const d=el('div');d.append(link(l.name,l.url));box.append(d)});
      if(p.cost)box.append(costs(p.cost));
      return box;
    });
  }));
  tick();
}
function section(head,rows,notes){
  const box=document.getElementById('limits');
  if(!rows.length)return;
  if(!box.hasChildNodes())box.append(el('h2','','Расходы'));
  box.append(el('h2','',head));
  const s=el('section');s.append(...rows);box.append(s);
  (notes||[]).forEach(t=>box.append(el('p','hint note',t)));
}
function plain(left,right,sub){
  const r=el('div','row plain');
  r.append(line(el('span','',left),el('span','time',right||'')));
  if(sub)r.append(el('div','hint',sub));
  return r;
}
function bar(label,percent){
  const v=Math.min(100,Math.max(0,percent)),b=el('div','bar'+(percent>=100?' over':percent>=80?' warn':''));
  b.setAttribute('role','progressbar');b.setAttribute('aria-label',label);b.setAttribute('aria-valuemin','0');b.setAttribute('aria-valuemax','100');b.setAttribute('aria-valuenow',String(Math.round(v)));
  const f=el('i');f.style.width=v+'%';b.append(f);
  return b;
}
function monthFrom(){
  const day=new Date(now()*1000).toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'}).split('-').map(Number);
  return 'с '+new Date(Date.UTC(day[0],day[1]-1,1,12)).toLocaleDateString('ru-RU',{day:'numeric',month:'short',timeZone:'UTC'});
}
function period(x){return x.period==='month'?monthFrom():x.period==='day'?'за сутки (PT)':x.period==='now'?'сейчас':''}
function usage(x){
  const r=el('div','row plain');
  if(x.percent===null){r.append(line(el('span','',x.label),el('span','time','нет метрики')),el('div','hint','бесплатно '+number(x.free)+' '+x.unit));return r}
  r.append(line(el('span','',x.label),el('span','time',x.paid>0?'≈'+money(x.paid)+' сверх':'')));
  r.append(el('div','hint',[period(x),number(x.used)+' из '+number(x.free)+' '+x.unit+' ('+number(x.percent)+'%)'+(x.stale?' · устарело':'')].filter(Boolean).join(' · ')));
  r.append(bar(x.label,x.percent));
  return r;
}
function balance(a){
  const k=a.balance,ru=d=>d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4),prod={'Batch API':'Batch'};
  const at=new Date(k.at*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Makassar'}).replace(', ',' ');
  const r=el('div','row plain'),left=el('div');
  left.append(el('div','big','Осталось ≈ '+money(k.left)),el('div','hint','Потрачено '+money(k.spent)+' с '+at));
  const help=el('button','help');help.type='button';help.setAttribute('aria-label','Подробности');help.setAttribute('aria-expanded',String(balanceOpen));
  help.append(el('span','','?'));
  help.addEventListener('click',()=>{haptic();balanceOpen=!balanceOpen;limits()});
  r.append(line(left,help));
  if(balanceOpen){
    const box=el('div','more');
    k.credits.forEach(x=>{
      const n=x.name.replace(/^API credit \((.*)\)$/,'$1'),ap=(x.applies||[]).map(y=>prod[y]||y).join(', ');
      const text=x.kind==='promo'?'Промо '+n+': '+money(x.left)+' из '+money(x.granted_total)+', выдан '+ru(x.granted)+', сгорает '+ru(x.expires)+' (через '+Math.ceil((Date.parse(x.expires+'T00:00:00Z')-Date.now())/864e5)+' дн.)':'Куплено: '+money(x.left)+(x.expires?', до '+ru(x.expires):', без срока');
      const d=el('div');d.style.display='block';d.append(el('div','',text),el('div','hint',ap));box.append(d);
    });
    [ 'Лимит '+money(k.limit)+' в месяц, на момент записи потрачено '+money(k.month_spent)+'; автопополнение '+(k.auto_reload?'включено':'выключено'),
      'За месяц: '+money(a.usd)+', '+number(a.calls)+' вызовов',
      number(a.input_tokens)+' вх., '+number(a.output_tokens)+' исх., кэш '+number(a.cache_read_tokens)+' чт. / '+number(a.cache_write_tokens)+' зап., поиск '+number(a.web_searches)
    ].forEach(t=>{const d=el('div','',t);d.style.display='block';box.append(d)});
    r.append(box);
  }
  return r;
}
function limits(){
  document.getElementById('limits').replaceChildren();
  const b=data.budget, g=data.billing, a=data.anthropic, q=data.quota||[];
  if(b&&b.cost!==undefined&&b.cost!==null)section('Месяц',[plain('Месяц: счёт '+money(b.cost,b.currency)+' из бюджета '+money(b.budget,b.currency),'',b.at?'по данным на '+stamp(b.at):'')]);
  if(g)section('Google по сервисам',g.state==='ok'&&g.rows.length?g.rows.map(x=>plain(x.service,money(x.cost,x.currency))):[plain('Выгрузка счёта ещё не пришла','')],g.at?['по данным на '+stamp(g.at)]:[]);
  if(a&&a.balance)section('Anthropic',[balance(a)]);
  section('Использование',q.map(usage),q.some(x=>x.key==='cpu'||x.key==='mem')?['Бесплатные лимиты Cloud Run и других сервисов общие на весь billing account; здесь считается только этот проект.']:[]);
}
function tick(){
  data&&data.active&&data.active.forEach((job,i)=>{
    const rows=document.querySelectorAll('#active .row'), r=rows[i];
    if(!r)return;
    r.querySelector('.line .time').textContent=clock(Math.max(0,now()-job.since));
    const step=job.steps[job.steps.length-1], live=r.querySelector('.more .current .time');
    if(live&&step){const text=live.firstChild.nodeValue;live.firstChild.nodeValue=clock(Math.max(0,now()-step.since))+text.slice(text.indexOf(' · '))}
  });
}
async function load(){
  if(busy||!app||!app.initData)return;
  busy=true;
  const asked=view;
  try{
    const response=await fetch(endpoint+(view==='costs'?'?view=costs':''),{headers:{Authorization:'tma '+app.initData},cache:'no-store'});
    if(!response.ok)throw Error(response.status);
    const body=await response.json();
    if(asked!==view)return;
    data=body;
    offset=data.now-Date.now()/1000;
    state.textContent=view==='costs'||data.active.length||data.waiting.length||data.published.length?'':'Пока ничего нет.';
    render();
  }catch(e){
    if(asked!==view)return;
    const code=e.message;
    state.textContent=code==='401'?'Открой заново из бота.':code==='403'?'Нет доступа.':code==='503'?'Сервер недоступен.':'Нет связи. Нажми «Обновить».';
  }finally{busy=false;if(asked!==view)load()}
}
function switchView(next){
  if(next===view)return;
  haptic();
  view=next;data=null;
  const url=new URL(location.href);url.searchParams.set('view',view);history.replaceState(null,'',url);
  ['active','waiting','published','limits'].forEach(id=>document.getElementById(id).replaceChildren());
  state.textContent=app&&app.initData?'Загрузка…':'Открой страницу из бота.';
  mark();load();
}
if(!app||!app.initData)state.textContent='Открой страницу из бота.';
Object.keys(views).forEach(k=>document.getElementById('tab-'+k).addEventListener('click',()=>switchView(k)));
document.getElementById('refresh').addEventListener('click',()=>{haptic();load()});
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
</script>
</body>
</html>
